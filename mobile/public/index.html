<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      This file overrides the framework's built-in index.html template (Expo's
      web build prefers public/index.html over its own when one exists) for
      the additions below: apple-touch-icon, manifest, theme-color, and a
      background-color style. None has a config-driven equivalent in this
      Expo/Metro web toolchain the way web.favicon does — that one is still
      generated and injected automatically as its own closing-head-tag-
      adjacent link tag, appended by the build itself; do not add a second
      one here. Everything else in this file is the stock template,
      unmodified, so the lang/title placeholders and script injection keep
      working exactly as they did without this override.

      IMPORTANT for whoever edits this comment: the build's injection step
      does a literal string replace of the head element's closing tag, so
      this comment must never spell that tag out literally (in any casing or
      quoting) — doing so once already hijacked the injection point and
      swallowed the favicon link into this comment instead of the real head.

      The icon link points at one static icon (icon.png, this app's existing
      light-colorway app icon), not a light/dark pair — "Add to Home Screen"
      on iOS and Android has no OS-level dark variant for this icon, the same
      constraint issue #25 already documented for the favicon, extended here
      rather than re-argued.

      The two theme-color tags below and the body background-color rule are
      issue #31's fix for the iOS PWA status bar staying white regardless of
      theme: a static prefers-color-scheme fallback for first paint / no-JS,
      and this app's own App.tsx (`ThemedPwaChrome`) overwrites both of these
      live once React mounts, to track an explicit in-app Light/Dark override
      that disagrees with the OS scheme. Values are `tokens.ts`'s light/dark
      `ground` hex, kept in sync by hand — same manual-sync convention that
      file's own doc comment already relies on, since this file has no way to
      import from it.
    -->
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)" />
    <style>
      body {
        background-color: #FAF6F1;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #15110D;
        }
      }
    </style>
    <!--
      #42's blank-page fix, one layer below App.tsx's own AppErrorBoundary.
      That boundary only catches a throw *inside* the mounted React tree —
      it cannot help if the bundle itself never finishes loading (a chunk
      request dropped on flaky mobile data, per the user's own report: a
      truly blank page, never the boundary's "Cartel hit a snag" screen) or
      if something throws before the boundary itself mounts. Both leave
      #root permanently empty with no React around to notice.
      cartel-boot-fallback is plain HTML/CSS/JS with no framework
      dependency, so it works even in that case: if #root still has no
      children a fixed delay after page load, something never rendered, and
      the fallback below becomes the only thing visible with a way out
      (reload). If the app boots normally this never shows and never
      matters — #root fills in well under the delay.
    -->
    <style id="cartel-boot-fallback-style">
      #cartel-boot-fallback {
        display: none;
        position: fixed;
        inset: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #F2E9DC;
        background-color: #15110D;
      }
      @media (prefers-color-scheme: light) {
        #cartel-boot-fallback {
          color: #1A140D;
          background-color: #FAF6F1;
        }
      }
      #cartel-boot-fallback button {
        font: inherit;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 999px;
        border: none;
        background-color: #C2410C;
        color: #FFFFFF;
        min-height: 44px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="cartel-boot-fallback" role="alert">
      <p style="margin: 0; font-size: 17px; font-weight: 600;">Cartel didn’t load</p>
      <p style="margin: 0; font-size: 14px; opacity: 0.8;">
        This can happen on a weak connection. Check your signal and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Reload</button>
    </div>
    <script>
      (function () {
        // 8s is generous past a normal cold load (this app's own
        // AppErrorBoundary testing measured ~200ms round trips on a good
        // connection) without making a genuinely slow-but-working load flash
        // the fallback needlessly.
        window.setTimeout(function () {
          var root = document.getElementById('root');
          var fallback = document.getElementById('cartel-boot-fallback');
          if (root && fallback && root.childElementCount === 0) {
            fallback.style.display = 'flex';
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
